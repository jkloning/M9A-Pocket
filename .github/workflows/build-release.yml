name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      maafw_tag:
        description: 'MaaFramework tag to override the cached .so (empty = setup script default latest)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    # 当前只发 arm64-v8a 真机包；要恢复四变体（universal / x64 / zz-arm64-v8a-emu-compat）
    # 参考 MAA-Meow 的 build-release.yml 矩阵，或本地跑 scripts/build_release_apks.py
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.1.12297006" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 打包配方是仓内相对路径，PI_PROFILE 指到它即可；版本与 versionCode 从 pi/interface.json 推导
      # （X.Y.Z -> XYYZZ，如 4.7.3 -> 40703；宿主按 versionCode 判断设备端资源缓存）
      - name: Configure build
        run: |
          VERSION=$(python -c "import json;print(json.load(open('pi/interface.json',encoding='utf-8'))['version'].lstrip('v'))")
          CODE=$(python -c "import re;m=re.search(r'(\d+)\.(\d+)\.(\d+)',open('pi/interface.json',encoding='utf-8').read());print(int(m.group(1))*10000+int(m.group(2))*100+int(m.group(3)))")
          {
            echo "pi.profile=pi-profile-m9a.yaml"
            echo "build.versionName=$VERSION"
            echo "build.versionCode=$CODE"
          } >> local.properties
          echo "versionName=$VERSION versionCode=$CODE"

      - name: Deploy MaaFramework native libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAAFW_ARG=""
          MAAFW_TAG="${{ github.event.inputs.maafw_tag }}"
          if [ -n "$MAAFW_TAG" ]; then
            MAAFW_ARG="--tag $MAAFW_TAG"
          fi
          python scripts/setup_maa_framework.py --abi arm64-v8a $MAAFW_ARG

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -Pmaa.abi=arm64-v8a

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/release
          TAG="${GITHUB_REF_NAME:-dev}"
          for f in *.apk; do
            mv "$f" "M9APocket-${TAG}-arm64-v8a.apk"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-arm64-v8a
          path: app/build/outputs/apk/release/*.apk

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: pipx install git-cliff

      - name: Generate changelog
        env:
          # git-cliff 用 GitHub API 解析 commit → @username（见 cliff.toml [remote.github]）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # cliff 模板出错也不能挡住发版：失败时退化为纯 git log 列表
          git-cliff --current --strip header --github-repo jkloning/M9A-Pocket -o RELEASE_NOTES.md \
            || git log --pretty=format:"- %s" -20 > RELEASE_NOTES.md
          cat >> RELEASE_NOTES.md << 'EOF'

          ---

          ### 下载

          `M9APocket-<版本>-arm64-v8a.apk`：ARM 64 位真机安装包（应用内「检查更新」也会自动匹配它）
          EOF

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk-arm64-v8a
          path: apks

      - name: Download mapping artifact
        uses: actions/download-artifact@v4
        with:
          name: release-mapping
          path: mappings

      - name: Pack mapping
        run: |
          TAG="${GITHUB_REF_NAME}"
          zip -q -9 -j "mapping-${TAG}.zip" mappings/mapping.txt
          ls -lh mapping-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          # 小写 mapping- 前缀，ASCII 升序下排在 M9APocket-*.apk 之后，不打乱下载列表
          files: |
            apks/*.apk
            mapping-*.zip
          body_path: RELEASE_NOTES.md
